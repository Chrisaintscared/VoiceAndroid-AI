name: VoiceAndroid
description: VoiceAttend AI – Voice-based attendance marking system.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# ===========================================================================
# Dependencies
# ===========================================================================
dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^9.0.0

  # HTTP client for FastAPI backend communication
  http: ^1.2.1

  # Audio recording from device microphone
  record: ^6.1.0

  # File system path helpers (temp directory for recordings)
  path_provider: ^2.1.3

  # Permissions (microphone)
  permission_handler: ^11.3.1

  # iOS style icons
  cupertino_icons: ^1.0.6
  http_parser: ^4.1.2

  # ── On-device ML (Phase 2 – add when .tflite model is ready) ────────────
  # Uncomment the block below ONLY after you have converted your Python model
  # to a .tflite file and placed it in assets/voice_model.tflite.
  #
  # tflite_flutter: ^0.11.0
  #
  # NOTE: numerical_arrays does NOT exist on pub.dev.  tflite_flutter's own
  # TensorBuffer / List<double> handling is all you need – no extra math
  # package is required for 1-D float embeddings.

# ===========================================================================
# Dev Dependencies
# ===========================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # App icon generator
  flutter_launcher_icons: ^0.13.1

# ===========================================================================
# App Icon Configuration
# ===========================================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

# ===========================================================================
# Flutter Config
# ===========================================================================
flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    # Uncomment when the TFLite model file is ready:
    # - assets/voice_model.tflite